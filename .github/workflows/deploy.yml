# Builds each extension and deploys the showcase to GitHub Pages.
# Based on the Vite "Deploying a Static Site -> GitHub Pages" guide.
name: Deploy extensions showcase to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # No package-lock.json is committed, so use `npm install` (not `npm ci`).
      - name: Build slope-analysis
        working-directory: slope-analysis
        run: |
          npm install
          npm run build

      - name: Assemble showcase site
        run: |
          rm -rf _site
          mkdir -p _site/slope-analysis
          cp index.html _site/index.html
          cp -r slope-analysis/dist/. _site/slope-analysis/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
